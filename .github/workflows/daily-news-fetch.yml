name: Automated News Fetcher Pipeline

on:
  schedule:
    # Runs every 2 hours every day
    - cron: '0 */2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Latest News Feeds
        run: npm run fetch:news

      - name: Commit and Push New Stories
        run: |
          git config --global user.name "The Kagojplane News Bot"
          git config --global user.email "bot@kagojplane.com"
          git add src/content/news/
          if git diff --staged --quiet; then
            echo "No new news stories found in this run."
          else
            git commit -m "Auto-publish fresh news updates via ingestion pipeline [skip ci]"
            git push origin main
          fi
